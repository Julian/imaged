name: CI

on:
  push:
    branches-ignore:
      - "wip*"
    tags:
      - "v*"
  pull_request:
  schedule:
    # Daily at 7:47
    - cron: "47 7 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  list:
    name: Identify nox sessions
    runs-on: ubuntu-latest
    outputs:
      noxenvs: ${{ steps.noxenvs-matrix.outputs.noxenvs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: ${{ github.ref_type != 'tag' }} # zizmor: ignore[cache-poisoning]
      - id: noxenvs-matrix
        run: |
          echo >>$GITHUB_OUTPUT noxenvs=$(
            uvx nox --list-sessions --json | jq '[.[].session]'
          )

  ci:
    name: ${{ matrix.noxenv }} (${{ matrix.os }})
    needs: list
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        noxenv: ${{ fromJson(needs.list.outputs.noxenvs) }}
        posargs: [""]
        include:
          - os: ubuntu-latest
            noxenv: "tests-3.14"
            posargs: coverage github

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libenchant-2-dev
        if: runner.os == 'Linux' && startsWith(matrix.noxenv, 'docs')
      - name: Install dependencies
        run: brew install enchant
        if: runner.os == 'macOS' && startsWith(matrix.noxenv, 'docs')

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: ${{ github.ref_type != 'tag' }} # zizmor: ignore[cache-poisoning]
      - name: Run nox
        run: uvx nox -s "${{ matrix.noxenv }}" -- ${{ matrix.posargs }} # zizmor: ignore[template-injection]

  engines:
    # The tests above drive a stand-in engine, which is what makes them
    # runnable everywhere.  These drive the real thing, once per engine,
    # because the entire promise of this package is that all of them
    # answer identically.
    name: ${{ matrix.engine }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: docker
            os: ubuntu-latest
          - engine: podman
            os: ubuntu-latest
          - engine: docker
            os: macos-latest
          - engine: podman
            os: macos-latest
          # Apple's container wants Virtualization.framework, which
          # GitHub's macOS runners can't offer -- they are themselves
          # VMs, and arm64 nested virtualization isn't available to
          # them (actions/runner-images#13505).  Covering it needs a
          # self-hosted Apple silicon runner:
          #
          #   - engine: container
          #     os: [self-hosted, macOS, ARM64]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman
        if: runner.os == 'Linux' && matrix.engine == 'podman'

      # Both engines need a Linux VM to run anything on macOS.
      - name: Start podman's VM
        run: |
          brew install podman
          podman machine init
          podman machine start
        if: runner.os == 'macOS' && matrix.engine == 'podman'
      - name: Start colima, for docker
        run: |
          brew install docker colima
          colima start
        if: runner.os == 'macOS' && matrix.engine == 'docker'

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: ${{ github.ref_type != 'tag' }} # zizmor: ignore[cache-poisoning]

      - name: Run the tests against ${{ matrix.engine }}
        env:
          IMAGED_ENGINE: ${{ matrix.engine }}
        run: uvx nox -s tests-3.14 -- -m real

  packaging:
    name: Build and publish
    needs: [ci, engines]
    runs-on: ubuntu-latest
    environment:
      name: PyPI
      url: https://pypi.org/p/imaged

    permissions:
      contents: write  # for creating releases
      id-token: write  # for trusted publishing to PyPI

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: ${{ github.ref_type != 'tag' }} # zizmor: ignore[cache-poisoning]

      - name: Build our distributions
        run: uv run --frozen --with 'build[uv]' -m build --installer=uv

      - name: Publish to PyPI
        if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # v1.14.1
      - name: Create a Release
        if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
        run: gh release create ${{ github.ref_name }} dist/* --generate-notes # zizmor: ignore[template-injection]
        env:
          GH_TOKEN: ${{ github.token }}
