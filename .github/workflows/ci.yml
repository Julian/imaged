name: CI

on:
  push:
    branches-ignore:
      - "wip*"
    tags:
      - "v*"
  pull_request:
  schedule:
    # Daily at 7:47
    - cron: "47 7 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  list:
    name: Identify nox sessions
    runs-on: ubuntu-latest
    outputs:
      noxenvs: ${{ steps.noxenvs-matrix.outputs.noxenvs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: ${{ github.ref_type != 'tag' }} # zizmor: ignore[cache-poisoning]
      - id: noxenvs-matrix
        run: |
          echo >>$GITHUB_OUTPUT noxenvs=$(
            uvx nox --list-sessions --json | jq '[.[].session]'
          )

  ci:
    name: ${{ matrix.noxenv }} (${{ matrix.os }})
    needs: list
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        noxenv: ${{ fromJson(needs.list.outputs.noxenvs) }}
        posargs: [""]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libenchant-2-dev
        if: runner.os == 'Linux' && startsWith(matrix.noxenv, 'docs')
      - name: Install dependencies
        run: brew install enchant
        if: runner.os == 'macOS' && startsWith(matrix.noxenv, 'docs')

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: ${{ github.ref_type != 'tag' }} # zizmor: ignore[cache-poisoning]
      - name: Run nox
        run: uvx nox -s "${{ matrix.noxenv }}" -- ${{ matrix.posargs }} # zizmor: ignore[template-injection]

      - name: Upload coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-${{ matrix.noxenv }}-${{ matrix.os }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: ignore

  engines:
    # The tests above drive a stand-in engine, which is what makes them
    # runnable everywhere.  These drive the real thing, once per engine,
    # because the entire promise of this package is that all of them
    # answer identically.
    name: ${{ matrix.engine }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: docker
            os: ubuntu-latest
          - engine: podman
            os: ubuntu-latest
          # No engine can run on GitHub's hosted macOS runners.  Every
          # one of them needs a Linux VM there, and those runners are
          # themselves VMs without nested virtualization
          # (actions/runner-images#13505), so podman's vfkit and
          # colima's lima both fail to start one -- as would Apple's
          # container, which wants Virtualization.framework directly.
          # Covering macOS at all needs a self-hosted Apple silicon
          # runner, at which point this becomes:
          #
          #   - engine: container
          #     os: [self-hosted, macOS, ARM64]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman
        if: matrix.engine == 'podman'


      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: ${{ github.ref_type != 'tag' }} # zizmor: ignore[cache-poisoning]

      - name: Run the tests against ${{ matrix.engine }}
        env:
          IMAGED_ENGINE: ${{ matrix.engine }}
        run: uvx nox -s tests-3.14 -- -m real

      - name: Upload coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-${{ matrix.engine }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: ignore

  coverage:
    # No single job covers everything -- the OS decides whether the
    # Windows specific paths run, and the engine decides whether the
    # real ones do -- so combining is the only way the total means
    # anything.
    name: Coverage
    needs: [ci, engines]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: ${{ github.ref_type != 'tag' }} # zizmor: ignore[cache-poisoning]

      - name: Combine what each job covered
        run: |
          uvx --with 'coverage[toml]' coverage combine
          uvx --with 'coverage[toml]' coverage report --format=markdown \
            --fail-under=0 >>"$GITHUB_STEP_SUMMARY"
          # Last, so that whatever's missing is in the log before this
          # decides the job.
          uvx --with 'coverage[toml]' coverage report

  packaging:
    name: Build and publish
    needs: [ci, engines, coverage]
    runs-on: ubuntu-latest
    environment:
      name: PyPI
      url: https://pypi.org/p/imaged

    permissions:
      contents: write  # for creating releases
      id-token: write  # for trusted publishing to PyPI

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: ${{ github.ref_type != 'tag' }} # zizmor: ignore[cache-poisoning]

      - name: Build our distributions
        run: uv run --frozen --with 'build[uv]' -m build --installer=uv

      - name: Publish to PyPI
        if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # v1.14.1
      - name: Create a Release
        if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
        run: gh release create ${{ github.ref_name }} dist/* --generate-notes # zizmor: ignore[template-injection]
        env:
          GH_TOKEN: ${{ github.token }}
